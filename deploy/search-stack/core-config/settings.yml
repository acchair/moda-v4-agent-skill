use_default_settings:
  engines:
    keep_only:
      - baidu
      - 360search
      - sogou
      - quark
      - bing
      - duckduckgo
      - brave

general:
  instance_name: "Moda SearXNG"
  enable_metrics: false

search:
  safe_search: 0
  default_lang: "zh-CN"
  formats:
    - html
    - json
  ban_time_on_fail: 10
  max_ban_time_on_fail: 180

server:
  port: 8080
  bind_address: 0.0.0.0
  limiter: false
  public_instance: false
  secret_key: "${SEARXNG_SECRET}"

engines:
  - name: baidu
    timeout: 8.0
    weight: 1.0
  - name: 360search
    timeout: 8.0
    weight: 1.2
  - name: sogou
    timeout: 8.0
    weight: 1.2
  - name: quark
    timeout: 8.0
    weight: 1.0
  - name: bing
    timeout: 8.0
    weight: 1.0
  - name: duckduckgo
    timeout: 8.0
    weight: 0.8
  - name: brave
    timeout: 8.0
    weight: 0.8
