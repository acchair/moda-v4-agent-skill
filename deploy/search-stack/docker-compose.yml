name: moda-search-stack

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: moda-searxng
    restart: unless-stopped
    ports:
      - "${SEARXNG_BIND_ADDRESS:-127.0.0.1}:${SEARXNG_PORT:-8888}:8080"
    env_file:
      - ./.env
    volumes:
      - ./core-config:/etc/searxng:rw
      - searxng-cache:/var/cache/searxng
    depends_on:
      - valkey

  valkey:
    image: docker.io/valkey/valkey:9-alpine
    container_name: moda-searxng-valkey
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - valkey-data:/data

volumes:
  searxng-cache:
  valkey-data:
